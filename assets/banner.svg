<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Ihsan Ramadhan - Full-Stack Web Developer">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#e6edf3"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
      @keyframes pulse { 0%,100% { opacity: 0.35 } 50% { opacity: 0.9 } }
      @keyframes scan { 0% { transform: translateY(-360px) } 100% { transform: translateY(360px) } }
      @keyframes dash { 0% { stroke-dashoffset: 900 } 100% { stroke-dashoffset: 0 } }
      .line { animation: dash 2.5s ease-out forwards; }
    </style>
  </defs>

  <rect width="1000" height="380" fill="#0d1117"/>

  <g opacity="0.5">
    <circle cx="120" cy="90" r="70" fill="#58a6ff" opacity="0.05"/>
    <circle cx="880" cy="80" r="90" fill="#3fb950" opacity="0.05"/>
    <circle cx="500" cy="340" r="120" fill="#8b5cf6" opacity="0.05"/>
  </g>

  <g font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,monospace">
    <text x="60" y="70" font-size="15" fill="#3fb950">$</text>
    <text x="85" y="70" font-size="15" fill="#e6edf3"> whoami</text>
    <rect x="0" y="0" width="0" height="0"/>
    <text x="60" y="102" font-size="34" fill="url(#titleGrad)" font-weight="700">
      Ihsan Ramadhan
    </text>
    <g>
      <text x="60" y="140" font-size="17" fill="#8b949e">Full-Stack Web Developer — building modern apps with </text>
      <text x="60" y="165" font-size="17" fill="#58a6ff">React</text>
      <text x="128" y="165" font-size="17" fill="#8b949e">, </text>
      <text x="140" y="165" font-size="17" fill="#3fb950">TypeScript</text>
      <text x="235" y="165" font-size="17" fill="#8b949e"> &amp; </text>
      <text x="258" y="165" font-size="17" fill="#8b5cf6">Node.js</text>
    </g>
  </g>

  <rect x="60" y="195" width="880" height="150" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <g>
    <circle cx="90" cy="213" r="7" fill="#ff5f57"/>
    <circle cx="112" cy="213" r="7" fill="#febc2e"/>
    <circle cx="134" cy="213" r="7" fill="#28c840"/>
    <text x="500" y="218" font-family="'JetBrains Mono','Fira Code',Menlo,monospace" font-size="13" fill="#8b949e" text-anchor="middle">ihsan@dev: ~/portfolio</text>
  </g>
  <line x1="60" y1="230" x2="940" y2="230" stroke="#21262d" stroke-width="1"/>

  <g font-family="'JetBrains Mono','Fira Code',Menlo,monospace" font-size="15">
    <g>
      <text x="80" y="260" fill="#3fb950">$</text>
      <text x="102" y="260" fill="#e6edf3"> cat stack.txt</text>
    </g>
    <g>
      <text x="80" y="286" fill="#8b949e">React</text>
      <text x="140" y="286" fill="#58a6ff">TypeScript</text>
      <text x="228" y="286" fill="#8b949e">Vite</text>
      <text x="268" y="286" fill="#3fb950">Tailwind</text>
      <text x="340" y="286" fill="#8b949e">Node</text>
      <text x="386" y="286" fill="#58a6ff">Express</text>
      <text x="456" y="286" fill="#8b949e">Prisma</text>
      <text x="516" y="286" fill="#3fb950">Firebase</text>
    </g>
    <g>
      <text x="80" y="314" fill="#3fb950">$</text>
      <text x="102" y="314" fill="#e6edf3"> npm run dev</text>
    </g>
    <g>
      <text x="80" y="334" fill="#28c840">✓</text>
      <text x="102" y="334" fill="#8b949e"> ready in </text>
      <text x="190" y="334" fill="#3fb950">123ms</text>
    </g>
  </g>

  <rect x="80" y="252" width="9" height="18" fill="#58a6ff">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <line x1="60" y1="365" x2="940" y2="365" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="900" to="0" dur="2s" repeatCount="1" fill="freeze"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </line>

  <g filter="url(#soft)" opacity="0.5">
    <circle cx="780" cy="90" r="4" fill="#58a6ff">
      <animate attributeName="cy" values="90;70;90" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="330" r="3" fill="#3fb950">
      <animate attributeName="cy" values="330;315;330" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="320" r="5" fill="#8b5cf6">
      <animate attributeName="cy" values="320;300;320" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="70" r="3" fill="#58a6ff">
      <animate attributeName="cy" values="70;55;70" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="60" y="0" width="880" height="380" fill="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;0.35;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
