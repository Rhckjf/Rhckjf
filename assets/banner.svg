<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Ihsan Ramadhan - full-stack developer">
  <defs>
    <linearGradient id="ink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131311"/>
      <stop offset="100%" stop-color="#0a0a09"/>
    </linearGradient>
    <linearGradient id="lineAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8ff4a"/>
      <stop offset="60%" stop-color="#c8ff4a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c8ff4a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" fill="url(#ink)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>

  <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
    <rect x="80" y="64" width="12" height="12" fill="#c8ff4a">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="104" y="74" font-size="15" fill="#7d7d72" letter-spacing="4">PORTFOLIO — 2026</text>
    <text x="1075" y="74" font-size="15" fill="#7d7d72" letter-spacing="3" text-anchor="end">PRF-001 / RHCKJF</text>
  </g>

  <g font-family="Georgia,'Times New Roman',serif">
    <text x="78" y="205" font-size="128" font-weight="700" fill="#f0eee4" letter-spacing="2">Ihsan</text>
    <text x="78" y="330" font-size="128" font-weight="700" fill="#f0eee4" letter-spacing="2">Ramadhan</text>
  </g>

  <rect x="80" y="355" width="640" height="2" fill="url(#lineAccent)">
    <animate attributeName="width" values="0;640" dur="1.4s" begin="0.6s" fill="freeze"/>
  </rect>

  <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace">
    <text x="80" y="415" font-size="24" fill="#c8ff4a">&gt;</text>
    <text x="108" y="415" font-size="24" fill="#e8e6db">full-stack developer</text>
    <rect x="416" y="393" width="14" height="22" fill="#c8ff4a">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" fill="#5f5f56" font-size="14">
    <text x="80" y="452">MEDAN — INDONESIA</text>
    <text x="1075" y="452" text-anchor="end" letter-spacing="2">EST. 2022</text>
  </g>

  <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" fill="#7d7d72" letter-spacing="3">
    <text x="1108" y="250" transform="rotate(-90 1108 250)" text-anchor="end">BUILD FOR THE WEB</text>
  </g>

  <g opacity="0.5">
    <circle cx="880" cy="120" r="3" fill="#c8ff4a">
      <animate attributeName="cy" values="120;100;120" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="200" r="2.5" fill="#f0eee4">
      <animate attributeName="cy" values="200;178;200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="330" r="2" fill="#c8ff4a">
      <animate attributeName="cy" values="330;310;330" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0" y="458" width="1200" height="2" fill="#ffffff" opacity="0.06"/>
</svg>
